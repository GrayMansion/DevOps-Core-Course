apiVersion: v1
kind: Service
metadata:
  name: wait-service
  labels:
    app: wait-service
spec:
  selector:
    app: wait-service
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wait-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wait-service
  template:
    metadata:
      labels:
        app: wait-service
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: init-wait-demo
  labels:
    app: init-wait-demo
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command:
        - sh
        - -c
        - until nslookup wait-service.default.svc.cluster.local; do echo waiting for wait-service; sleep 2; done
  containers:
    - name: main-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo dependency ready; sleep 3600
  restartPolicy: Always
